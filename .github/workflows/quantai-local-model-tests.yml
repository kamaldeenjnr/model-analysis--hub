name: QuantAI local model checks

on:
  push:
    paths:
      - "quantai-model/**"
      - ".github/workflows/quantai-local-model-tests.yml"
  pull_request:
    paths:
      - "quantai-model/**"
      - ".github/workflows/quantai-local-model-tests.yml"

jobs:
  data-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: quantai-model/requirements.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.51,<5" "fastapi>=0.115,<1" "pytest>=8,<9"
      - name: Validate training and held-out data
        working-directory: quantai-model
        run: python validate_data.py --train data/train.jsonl --eval data/eval.jsonl
      - name: Compile Python modules
        run: python -m compileall -q quantai-model
      - name: Run local response guard tests
        working-directory: quantai-model
        run: pytest -q test_local_service.py
