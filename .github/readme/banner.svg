<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Model Analysis Hub: the website and QuantAI statistics engine">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C203B"/><stop offset="1" stop-color="#081629"/></linearGradient>
<clipPath id="r"><rect width="1280" height="320" rx="22"/></clipPath>
<style>.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.b{opacity:0;animation:grow .9s cubic-bezier(.2,.7,.2,1) forwards;transform-origin:bottom;transform-box:fill-box}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{from{opacity:0;transform:scaleY(.1)}to{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.b,.rise{animation:none;opacity:1}}</style></defs>
<g clip-path="url(#r)"><rect width="1280" height="320" fill="url(#bg)"/>
